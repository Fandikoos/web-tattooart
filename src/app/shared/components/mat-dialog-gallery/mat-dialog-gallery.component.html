  <h1 class="text-2xl md:text-3xl font-semibold text-center mb-6 mt-6">
    Gallery
  </h1>
  @if (data && data.length > 0) {
    <swiper-container
      class="studio-gallery rounded-2xl overflow-hidden shadow-2xl"
      navigation
      pagination
      pagination-type="bullets"
      autoplay-delay="5000"
      effect="slide"
      keyboard
    >
      @for (image of data; track image.idImage) {
        <swiper-slide class="relative">
          <img
            [src]="image.url"
            [alt]="image.storedName"
            class="w-full h-[60vh] object-cover"
          />
        </swiper-slide>
      }
    </swiper-container>
  }
