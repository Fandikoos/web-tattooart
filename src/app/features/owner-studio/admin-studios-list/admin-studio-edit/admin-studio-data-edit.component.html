<form
  [formGroup]="editStudioForm"
  (ngSubmit)="onSubmit()"
  class="w-full grid grid-cols-1 md:grid-cols-2 gap-6 space-y-4 ml-7"
>
  <div class="width-card-label">
    <label
      for="name"
      class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
      >Name</label
    >
    <input
      id="name"
      required="true"
      type="text"
      formControlName="name"
      placeholder="Name"
      class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:text-white"
    />
  </div>

  <div>
    <label
      for="address"
      class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
      >Address</label
    >
    <input
      id="address"
      type="text"
      required="true"
      formControlName="address"
      placeholder="Address"
      class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:text-white"
    />
  </div>

  <div>
    <label
      for="lat"
      class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
      >Latitud</label
    >
    <input
      id="lat"
      type="number"
      formControlName="lat"
      class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:text-white"
    />
    @if (editStudioForm.get("lat")?.invalid) {
      <div class="text-red-500 text-sm mt-1">Latitud is required</div>
    }
  </div>

  <div>
    <label
      for="long"
      class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
      >Longitud</label
    >
    <input
      id="long"
      type="number"
      formControlName="long"
      class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:text-white"
    />
    @if (editStudioForm.get("long")?.invalid) {
      <div class="text-red-500 text-sm mt-1">Longitud is required</div>
    }
  </div>

  <div>
    <label
      for="openSchedule"
      class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
      >Open Schedule</label
    >
    <input
      id="openSchedule"
      type="datetime"
      formControlName="openSchedule"
      class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:text-white"
    />
  </div>

  <div>
    <label
      for="closeSchedule"
      class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
      >Close Schedule</label
    >
    <input
      id="closeSchedule"
      type="datetime"
      formControlName="closeSchedule"
      class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:text-white"
    />
  </div>

  <div>
    <label
      for="description"
      class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
      >Description</label
    >
    <textarea
      id="description"
      rows="3"
      formControlName="description"
      class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:text-white"
    ></textarea>
  </div>

  <!-- TODO: Cambiar como se procesan las imagenes
  <div>
    <label for="logo" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Logo</label>
    <input id="logo" type="file" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:text-white"/>
  </div>
  -->

  <div class="md:col-span-2 flex justify-end">
    @if (studio() != null || studio() != undefined) {
      <button
        type="submit"
        [disabled]="editStudioForm.invalid"
        class="py-2 px-6 rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 transition duration-200 disabled:bg-gray-400 disabled:cursor-not-allowed shadow-sm"
      >
        Apply
      </button>
    } @else {
      <button
        type="submit"
        [disabled]="editStudioForm.invalid"
        class="py-2 px-6 rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 transition duration-200 disabled:bg-gray-400 disabled:cursor-not-allowed shadow-sm"
      >
        Create
      </button>
    }
    <button
      type="button"
      class="py-2 px-6 ml-5 rounded-lg text-white bg-gray-600 hover:bg-gray-700 transition duration-200 disabled:bg-gray-400 disabled:cursor-not-allowed shadow-sm"
      (click)="close()"
    >
      Cancel
    </button>
  </div>
</form>
