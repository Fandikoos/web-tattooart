<aside class="bg-gradient-to-b from-gray-900 to-gray-950 h-screen w-72 flex flex-col border-r border-white/10 shadow-2xl shrink-0 sticky top-0 overflow-y-auto">

  <!-- Logo / Brand -->
  <div class="px-6 py-5 border-b border-white/10">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-cyan-400 to-cyan-600 flex items-center justify-center shadow-lg shadow-cyan-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 text-white">
          <path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z" />
        </svg>
      </div>
      <div>
        <h1 class="text-white font-bold text-sm tracking-wide">Tattooart Connect</h1>
        <p class="text-cyan-400 text-xs font-medium">Admin Panel</p>
      </div>
    </div>
  </div>

  <!-- User Info -->
  <div class="px-6 py-4 border-b border-white/10">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center text-white font-bold text-sm shadow-md shrink-0">
        {{ nameAdminUser ? nameAdminUser[0].toUpperCase() : '?' }}
      </div>
      <div class="min-w-0">
        <p class="text-white text-sm font-medium truncate">{{ nameAdminUser }}</p>
        <span class="text-xs text-cyan-400 font-medium bg-cyan-400/10 px-2 py-0.5 rounded-full">Admin</span>
      </div>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-4 py-6 overflow-y-auto">
    <p class="text-gray-500 text-xs font-semibold uppercase tracking-widest mb-3 px-2">Overview</p>
    <ul class="flex flex-col gap-1">
      <li>
        <button
          routerLink="/admin/home"
          routerLinkActive="!bg-gradient-to-r !from-cyan-500/20 !to-blue-500/10 !text-white border-l-2 border-cyan-400"
          class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition-all text-sm font-medium border-l-2 border-transparent"
          type="button"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 shrink-0">
            <path d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z" />
          </svg>
          Dashboard
        </button>
      </li>
    </ul>

    <p class="text-gray-500 text-xs font-semibold uppercase tracking-widest mb-3 mt-5 px-2">Management</p>
    <ul class="flex flex-col gap-1">
      <li>
        <button
          routerLink="/admin/dashboard"
          routerLinkActive="!bg-gradient-to-r !from-cyan-500/20 !to-blue-500/10 !text-white border-l-2 border-cyan-400"
          class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition-all text-sm font-medium border-l-2 border-transparent"
          type="button"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 shrink-0">
            <path d="M11.47 3.841a.75.75 0 0 1 1.06 0l8.69 8.69a.75.75 0 1 0 1.06-1.061l-8.689-8.69a2.25 2.25 0 0 0-3.182 0l-8.69 8.69a.75.75 0 1 0 1.061 1.06l8.69-8.689Z" />
            <path d="m12 5.432 8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 0 1-.75-.75v-4.5a.75.75 0 0 0-.75-.75h-3a.75.75 0 0 0-.75.75V21a.75.75 0 0 1-.75.75H5.625a1.875 1.875 0 0 1-1.875-1.875v-6.198a2.29 2.29 0 0 0 .091-.086L12 5.43Z" />
          </svg>
          My Studios
        </button>
      </li>
      <li>
        <button
          routerLink="/admin/artists"
          routerLinkActive="!bg-gradient-to-r !from-cyan-500/20 !to-blue-500/10 !text-white border-l-2 border-cyan-400"
          class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white hover:bg-white/5 transition-all text-sm font-medium border-l-2 border-transparent"
          type="button"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 shrink-0">
            <path d="M4.5 6.375a4.125 4.125 0 1 1 8.25 0 4.125 4.125 0 0 1-8.25 0ZM14.25 8.625a3.375 3.375 0 1 1 6.75 0 3.375 3.375 0 0 1-6.75 0ZM1.5 19.125a7.125 7.125 0 0 1 14.25 0v.003l-.001.119a.75.75 0 0 1-.363.63 13.067 13.067 0 0 1-6.761 1.873c-2.472 0-4.786-.684-6.76-1.873a.75.75 0 0 1-.364-.63l-.001-.122ZM17.25 19.128l-.001.144a2.25 2.25 0 0 1-.233.96 10.088 10.088 0 0 0 5.06-1.01.75.75 0 0 0 .42-.643 4.875 4.875 0 0 0-6.957-4.611 8.586 8.586 0 0 1 1.71 5.157v.003Z" />
          </svg>
          My Artists
        </button>
      </li>
    </ul>
  </nav>

  <!-- Footer del menú -->
  <div class="px-6 py-4 border-t border-white/10">
    <p class="text-gray-600 text-xs text-center">Tattooart Connect &copy; 2026</p>
  </div>

</aside>
