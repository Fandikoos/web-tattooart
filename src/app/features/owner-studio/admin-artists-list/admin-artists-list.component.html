<div class="p-6">
  <div class="flex items-center mb-6">
    <h1 class="text-2xl font-semibold text-white tracking-wide">My Artists</h1>
    @if (!editArtist) {
    <button
      type="button"
      class="text-white bg-gradient-to-r ml-4 from-cyan-400 via-cyan-500 to-cyan-600 hover:bg-gradient-to-br focus:ring-4 focus:outline-none focus:ring-cyan-300 dark:focus:ring-cyan-800 font-medium rounded-lg text-sm px-5 py-2.5 text-center shadow-md hover:shadow-lg transition-all"
      (click)="prepareAddArtist()"
    >
      + Add Artist
    </button>
    }
  </div>

  @if (!editArtist) {
    <!-- Contenedor del listado -->
    <div
      class="bg-gradient-to-br from-gray-800 to-gray-900 p-6 rounded-2xl shadow-lg border border-white/10"
    >
      <!-- Header del listado -->
      <div
        class="grid grid-cols-7 gap-4 border-b border-white/10 pb-3 mb-4 text-gray-300 text-sm uppercase tracking-wide"
      >
        <span>Name</span>
        <span>Surname</span>
        <span>Second Surname</span>
        <span>Email</span>
        <span class="ml-4">Phone</span>
        <span>Image Artist</span>
        <span>Actions</span>
      </div>

      <!-- Fila de ejemplo -->
      @for (artist of artists(); track artist.idArtist) {
        <div
          class="grid grid-cols-7 gap-4 py-3 px-2 rounded-lg hover:bg-white/5 transition text-sm"
        >
          <span class="font-medium">{{ artist.name }}</span>
          <span>{{ artist.surname }}</span>
          <span>{{ artist.secondSurname }}</span>
          <span>{{ artist.email }}</span>
          <span class="ml-4">{{ artist.phone }}</span>
          <img srcset="{{ artist.imageArtist }}" class="w-30 h-15 object-cover rounded-2xl" />

           <div class="flex gap-2">
            <button
              (click)="prepareEditArtist(artist)"
              class="text-blue-400 hover:text-blue-300 font-medium text-sm transition"
            >
              Edit
            </button>
            <button
              (click)="deleteArtist(artist.idArtist!)"
              class="text-red-400 hover:text-red-300 font-medium text-sm transition"
            >
              Delete
            </button>
          </div>
        </div>
      }
    </div>
  } @else {
    <app-admin-artist-edit [artist]="artistToEdit()" [idTattooStudio]="idTattooStudio" (artistToEmit)="onEditFinished($event)"/>
  }

</div>
