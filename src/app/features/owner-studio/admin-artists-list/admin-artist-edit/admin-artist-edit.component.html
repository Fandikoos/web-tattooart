<form
  [formGroup]="editArtistForm"
  (ngSubmit)="saveArtist()"
  class="w-full grid grid-cols-1 md:grid-cols-2 gap-6 space-y-4 ml-7"
>
  <div class="width-card-label">
    <label
      for="name"
      class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
    >
      Name
    </label>
    <input
      type="text"
      required="true"
      id="name"
      placeholder="Name"
      formControlName="name"
      class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:text-white"
    />
  </div>

  <div class="width-card-label">
    <label
      for="surname"
      class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
    >
      Surname
    </label>
    <input
      type="text"
      required="true"
      id="surname"
      placeholder="Surname"
      formControlName="surname"
      class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:text-white"
    />
  </div>

  <div class="width-card-label">
    <label
      for="secondSurname"
      class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
    >
      Second Surname
    </label>
    <input
      type="text"
      required="true"
      id="secondSurname"
      placeholder="Second Surname"
      formControlName="secondSurname"
      class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:text-white"
    />
  </div>

  <div class="width-card-label">
    <label
      for="email"
      class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
    >
      Email
    </label>
    <input
      type="text"
      required="true"
      id="email"
      placeholder="Email"
      formControlName="email"
      class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:text-white"
    />
  </div>

  <div class="width-card-label">
    <label
      for="dni"
      class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
    >
      DNI
    </label>
    <input
      type="text"
      required="true"
      id="dni"
      placeholder="DNI"
      formControlName="dni"
      class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:text-white"
    />
  </div>

  <div class="width-card-label">
    <label
      for="phone"
      class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
    >
      Phone
    </label>
    <input
      type="text"
      required="true"
      id="phone"
      placeholder="Phone"
      formControlName="phone"
      class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:text-white"
    />
  </div>

  <!-- <div class="width-card-label">
    <label
      for="imageArtist"
      class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
    >
      Image Artist
    </label>
    <input
      type="file"
      required="true"
      id="imageArtist"
      placeholder="Image Artist"
      formControlName="imageArtist"
      class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:text-white"
    />
  </div> -->

  <div class="md:col-span-2 flex justify-end">
    @if (artist() != null || artist() != undefined) {
      <button
        type="submit"
        [disabled]="editArtistForm.invalid"
        class="py-2 px-6 rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 transition duration-200 disabled:bg-gray-400 disabled:cursor-not-allowed shadow-sm"
      >
        Apply
      </button>
    } @else {
      <button
        type="submit"
        [disabled]="editArtistForm.invalid"
        class="py-2 px-6 rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 transition duration-200 disabled:bg-gray-400 disabled:cursor-not-allowed shadow-sm"
      >
        Create
      </button>
    }
    <button
      type="button"
      class="py-2 px-6 ml-5 rounded-lg text-white bg-gray-600 hover:bg-gray-700 transition duration-200 disabled:bg-gray-400 disabled:cursor-not-allowed shadow-sm"
      (click)="close()"
    >
      Cancel
    </button>
  </div>
</form>
