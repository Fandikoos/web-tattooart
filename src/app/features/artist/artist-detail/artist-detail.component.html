<div class="bg-white dark:bg-gray-800 rounded-xl shadow-md overflow-hidden hover:shadow-xl transition-all duration-300">
  <div class="p-5">
    <div class="flex items-center space-x-5">
      <!-- Avatar del artista -->
      <div class="flex-shrink-0">
        <img class="w-16 h-16 md:w-20 md:h-20 rounded-full object-cover border-2 border-indigo-100 dark:border-indigo-900"
             [src]="artist().imageArtist || 'assets/default-artist.jpg'" 
             alt="{{artist().name}}">
      </div>
      
      <!-- Información del artista -->
      <div class="flex-1 min-w-0 space-y-1">
        <h3 class="text-lg font-semibold text-gray-900 dark:text-white truncate">
          {{artist().name}} {{artist().surname}}
        </h3>
        
        <p class="text-sm text-indigo-600 dark:text-indigo-400 truncate">
          {{artist().email}}
        </p>
        
        <p class="text-sm text-gray-500 dark:text-gray-400 flex items-center">
          <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
          </svg>
          {{artist().phone}}
        </p>
      </div>
    </div>
    
  </div>
</div>
