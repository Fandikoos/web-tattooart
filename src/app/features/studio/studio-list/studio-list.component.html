<section class="container mx-auto px-4 py-8">
  <div class="flex flex-col lg:flex-row gap-8">
    <!-- Sección de Filtros (más estrecha) -->
    <aside class="lg:w-1/4 bg-white dark:bg-gray-800 p-6 rounded-lg shadow-md h-fit sticky top-4">
      <app-filter (filterChangeNameValue)="onFilterChange($event)"/>
    </aside>

    <!-- Sección principal de estudios (más ancha) -->
    <main class="lg:w-3/4">
      @if (studios() != null) {
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          @for (studio of paginatedStudios(); track $index) {
            <article class="bg-white dark:bg-gray-800 rounded-xl shadow-md overflow-hidden transition-all duration-300 ease-in-out hover:scale-105 hover:shadow-xl transform origin-center">
              
              <div>
                <i class="fa-regular fa-star"></i>
              </div>

              <!-- Imagen del estudio -->
              <div class="h-48 overflow-hidden">
                <img [src]="studio.logo" alt="{{studio.name}}"class="w-full h-full object-cover">
              </div>

              <!-- Contenido -->
              <div class="p-5">
                <div class="flex justify-between items-start mb-2">
                  <h3 class="text-xl font-bold text-gray-900 dark:text-white truncate">{{studio.name}}</h3>
                  <span class="bg-indigo-100 text-indigo-800 text-xs font-semibold px-2.5 py-0.5 rounded dark:bg-indigo-200 dark:text-indigo-900">
                    ★ {{studio.rating}}
                  </span>
                </div>
                                
                <div class="flex items-center text-sm text-gray-500 dark:text-gray-400 mb-4">
                  <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path>
                  </svg>
                  {{studio.address}}
                </div>
                
                <a [routerLink]="['/studio', studio.idStudio]" class="inline-flex items-center justify-center px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 focus:ring-4 focus:ring-indigo-300 dark:bg-indigo-500 dark:hover:bg-indigo-600 transition-colors duration-200 w-full">
                  Ver estudio
                  <svg class="w-3.5 h-3.5 ml-2" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                  </svg>
                </a>
              </div>
            </article>
          }
        </div>

          <app-paginator 
          [objectsToPaginate]="studios() || []" 
          [initialPageSize]="9" 
          [initialPageIndex]="0"
          [pageSizeOptions]="[9, 18]" 
          [showFirstLastButtons]="false"
          [hidePageSize]="false"
          (paginatedObjects)="onPaginatedStudiosChange($event)"
          />

      
      } @else {
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
         <p>Loading data...</p>
        </div>
      }
    </main>
  </div>
</section>
