<h2 class="text-xl font-bold mb-4 text-gray-800 dark:text-white">Filtros</h2>

<div class="space-y-4">
  <!-- Ejemplo de filtro -->
  <div>
    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Ubicación</label>
    <input type="text" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:text-white">
  </div>
  
  <!-- Otros filtros -->
  <div>
    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Estilo</label>
    <select class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:text-white">
      <option>Todos</option>
      <option>Blackwork</option>
      <option>Acuarela</option>
      <option>Realista</option>
    </select>
  </div>
  
  <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-4 rounded-md transition duration-200">
    Aplicar Filtros
  </button>
</div>
