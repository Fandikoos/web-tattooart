<div class="flex items-center gap-2 mb-1">
  <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2a1 1 0 01-.293.707L13 13.414V19a1 1 0 01-.553.894l-4 2A1 1 0 017 21v-7.586L3.293 6.707A1 1 0 013 6V4z"/>
  </svg>
  <h2 class="text-base font-semibold text-gray-900 dark:text-white tracking-wide">Filters</h2>
</div>
<div class="h-px bg-gradient-to-r from-indigo-500 via-indigo-300 to-transparent mb-5"></div>

<form [formGroup]="filterForm" (ngSubmit)="onSubmit()" class="space-y-5">

  <div class="space-y-1.5">
    <label for="name" class="text-xs font-semibold uppercase tracking-wider text-gray-400 dark:text-gray-500">
      Studio name
    </label>
    <div class="relative">
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
      </svg>
      <input
        id="name"
        type="text"
        formControlName="name"
        placeholder="Search studios..."
        class="w-full pl-9 pr-3 py-2.5 text-sm bg-gray-50 dark:bg-gray-700/50 border border-gray-200 dark:border-gray-600 rounded-lg text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
      >
    </div>
  </div>

  <div class="space-y-2">
    <label class="text-xs font-semibold uppercase tracking-wider text-gray-400 dark:text-gray-500">
      Rating range
    </label>
    <div class="flex items-end gap-2">
      <div class="flex-1 space-y-1">
        <span class="text-xs text-gray-400 dark:text-gray-500">Min</span>
        <input
          id="minRating"
          type="number"
          formControlName="minRating"
          min="0"
          max="5"
          step="0.5"
          class="w-full px-3 py-2.5 text-sm text-center bg-gray-50 dark:bg-gray-700/50 border border-gray-200 dark:border-gray-600 rounded-lg text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
        >
      </div>
      <div class="pb-2.5 text-gray-300 dark:text-gray-600 font-light">—</div>
      <div class="flex-1 space-y-1">
        <span class="text-xs text-gray-400 dark:text-gray-500">Max</span>
        <input
          id="maxRating"
          type="number"
          formControlName="maxRating"
          min="0"
          max="5"
          step="0.5"
          class="w-full px-3 py-2.5 text-sm text-center bg-gray-50 dark:bg-gray-700/50 border border-gray-200 dark:border-gray-600 rounded-lg text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
        >
      </div>
    </div>
    <div class="flex justify-between text-xs text-amber-400">
      <span>★ 0</span>
      <span>★★★★★ 5</span>
    </div>
  </div>

  <button
    type="submit"
    [disabled]="filterForm.invalid"
    class="w-full py-2.5 px-4 flex items-center justify-center gap-2 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-300 dark:disabled:bg-gray-600 disabled:cursor-not-allowed rounded-lg transition-all duration-200 shadow-sm hover:shadow-md cursor-pointer"
  >
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
    </svg>
    Apply filters
  </button>

</form>
