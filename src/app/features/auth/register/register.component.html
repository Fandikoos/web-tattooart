<div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-sm">
    <img src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=600" alt="Your Company" class="mx-auto h-10 w-auto" />
    <h2 class="mt-10 text-center text-2xl/9 font-bold tracking-tight text-gray-900">Crea una nueva cuenta</h2>
    <p class="mt-2 text-center text-sm text-gray-600">
      ¿Ya tienes una cuenta?
      <a href="#" class="font-semibold text-indigo-600 hover:text-indigo-500">Inicia sesión aquí</a>
    </p>
  </div>

  <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
    <form #f="ngForm" (ngSubmit)="onRegister()" class="space-y-6">

      <div>
        <label for="username" class="block text-sm/6 font-medium text-gray-900">Nombre de usuario</label>
        <div class="mt-2">
          <input id="username" [(ngModel)]="username" type="text" name="username" required class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6" />
        </div>
      </div>

      <div>
        <label for="email" class="block text-sm/6 font-medium text-gray-900">Correo electrónico</label>
        <div class="mt-2">
          <input id="email" [(ngModel)]="email" type="email" name="email" required autocomplete="email" class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6" />
        </div>
      </div>

      <div>
        <label for="password" class="block text-sm/6 font-medium text-gray-900">Contraseña</label>
        <div class="mt-2">
          <input id="password" [(ngModel)]="password" type="password" name="password" required class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6" />
          <p class="mt-1 text-xs text-gray-500">Mínimo 8 caracteres con letras y números</p>
        </div>
      </div>

      <div>
        <button type="submit" [disabled]="!f.valid" class="flex w-full justify-center rounded-md bg-indigo-600 px-3 py-1.5 text-sm/6 font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
          Registrarse
        </button>
      </div>
    </form>
  </div>
</div>
