<div class="flex min-h-screen items-center justify-center px-6">
  <div
    class="w-full max-w-sm rounded-2xl bg-white/10 p-8 shadow-xl backdrop-blur-md"
  >
    <div class="text-center">
      <img
        src="https://flowbite.com/docs/images/logo.svg"
        alt="Tattoart Connect logo"
        class="mx-auto h-12 w-auto"
      />
      <h2 class="mt-6 text-2xl font-bold tracking-tight text-white">
        Welcome back
      </h2>
      <p class="mt-1 text-sm text-gray-300">Sign in to your account</p>
    </div>

    <form #f="ngForm" (ngSubmit)="onLogin()" class="mt-8 space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-200">
          Username or email
        </label>
        <input
          [(ngModel)]="username"
          name="username"
          required
          type="text"
          class="mt-2 w-full rounded-lg border border-white/20 bg-white/5 px-4 py-2 text-white placeholder-gray-400 focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/40"
        />
      </div>

      <div>
        <div class="flex items-center justify-between">
          <label class="text-sm font-medium text-gray-200"> Password </label>
          <a
            routerLink="/register"
            class="text-sm font-semibold text-indigo-400 hover:text-indigo-300"
          >
            Create account
          </a>
        </div>

        <input
          [(ngModel)]="password"
          name="password"
          required
          type="password"
          class="mt-2 w-full rounded-lg border border-white/20 bg-white/5 px-4 py-2 text-white placeholder-gray-400 focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/40"
        />

        @if (backendErrors["usernameOrEmail"]) {
          <p class="validation-error">
            {{ backendErrors["usernameOrEmail"] }}
          </p>
        }
      </div>

      <button
        type="submit"
        [disabled]="!f.valid"
        class="w-full rounded-lg bg-gradient-to-r from-indigo-500 to-purple-600 py-2.5 font-semibold text-white transition hover:opacity-90 disabled:opacity-40"
      >
        Log in
      </button>
    </form>
  </div>
</div>
