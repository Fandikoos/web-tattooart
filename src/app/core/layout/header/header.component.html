<header class="bg-gray-800 dark:bg-gray-900">
  <div class="mx-auto w-full max-w-screen-xl p-4 flex justify-between items-center">
    <a class="flex items-center">
      <img src="https://flowbite.com/docs/images/logo.svg" class="h-8 me-3" alt="Tattooart Connect Logo" />
      <span class="self-center text-2xl font-semibold text-white whitespace-nowrap">Tattooart Connect</span>
    </a>
    <nav class="space-x-8 text-sm font-medium">
      @if (!tokenService.isLogged()) {
        <a routerLink="#" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="text-gray-400 hover:text-white">Studios</a>
        <a routerLink="/login" routerLinkActive="active" class="text-gray-400 hover:text-white">Log in</a>
      } @else {
          @if (!tokenService.isAdmin()) {
            <a routerLink="/studios" routerLinkActive="active" class="text-gray-400 hover:text-white">Studios</a>
            <a routerLink="/user/profile" routerLinkActive="active" class="text-gray-400 hover:text-white">User profile</a>
          } @else {
            <button routerLink="/admin/dashboard" class="text-gray-400 hover:text-white">Studio zone</button>
          }
          <button class="text-gray-400 hover:text-white" (click)="logout()">Log out</button>
      }
    </nav>
  </div>
</header>
