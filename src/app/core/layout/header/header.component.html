<header class="bg-gray-900/95 backdrop-blur border-b border-white/8 sticky top-0 z-40">
  <div class="mx-auto w-full max-w-screen-xl px-6 py-3 flex justify-between items-center">

    <a routerLink="/" class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4 text-white">
          <path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z" />
        </svg>
      </div>
      <span class="text-white font-bold text-base tracking-wide">Tattooart Connect</span>
    </a>

    <nav class="flex items-center gap-2 text-sm font-medium">
      @if (!tokenService.isLogged()) {
        <a routerLink="/studios" routerLinkActive="text-white" class="text-gray-400 hover:text-white transition-colors px-3 py-1.5">Studios</a>
        <a routerLink="/login" class="bg-gradient-to-r from-cyan-500 to-blue-600 text-white px-4 py-1.5 rounded-lg hover:opacity-90 transition-opacity font-semibold">
          Log in
        </a>
      } @else {
        @if (!tokenService.isAdmin()) {
          <a routerLink="/studios" routerLinkActive="text-white" class="text-gray-400 hover:text-white transition-colors px-3 py-1.5">Studios</a>
          <a routerLink="/user/profile" routerLinkActive="text-white" class="text-gray-400 hover:text-white transition-colors px-3 py-1.5">My profile</a>
        } @else {
          <button routerLink="/admin/home" class="text-gray-400 hover:text-white transition-colors px-3 py-1.5 cursor-pointer">Admin panel</button>
        }
        <button
          (click)="logout()"
          class="flex items-center gap-1.5 text-gray-400 hover:text-red-400 transition-colors px-3 py-1.5 cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4">
            <path fill-rule="evenodd" d="M7.5 3.75A1.5 1.5 0 0 0 6 5.25v13.5a1.5 1.5 0 0 0 1.5 1.5h6a1.5 1.5 0 0 0 1.5-1.5V15a.75.75 0 0 1 1.5 0v3.75a3 3 0 0 1-3 3h-6a3 3 0 0 1-3-3V5.25a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3V9A.75.75 0 0 1 15 9V5.25a1.5 1.5 0 0 0-1.5-1.5h-6Zm10.72 4.72a.75.75 0 0 1 1.06 0l3 3a.75.75 0 0 1 0 1.06l-3 3a.75.75 0 1 1-1.06-1.06l1.72-1.72H9a.75.75 0 0 1 0-1.5h10.94l-1.72-1.72a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" />
          </svg>
          Log out
        </button>
      }
    </nav>

  </div>
</header>
